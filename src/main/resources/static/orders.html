<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - ShopEasy</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .track-timeline { display: flex; justify-content: space-between; position: relative; margin: 30px 0 20px; padding: 0 10px; }
        .track-timeline::before { content: ''; position: absolute; top: 15px; left: 8%; right: 8%; height: 3px; background: #e5e7eb; z-index: 0; }
        .track-step { display: flex; flex-direction: column; align-items: center; z-index: 1; flex: 1; position: relative; }
        .track-dot { width: 32px; height: 32px; border-radius: 50%; background: white; border: 3px solid #e5e7eb; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #9ca3af; font-weight: 700; transition: all 0.3s; }
        .track-step.done .track-dot { background: #10b981; border-color: #10b981; color: white; }
        .track-step.active .track-dot { background: #4f46e5; border-color: #4f46e5; color: white; animation: pulse 1.5s infinite; }
        .track-step.cancelled .track-dot { background: #ef4444; border-color: #ef4444; color: white; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(79,70,229,0.5); } 50% { box-shadow: 0 0 0 8px rgba(79,70,229,0); } }
        .track-label { font-size: 12px; color: #6b7280; margin-top: 8px; text-align: center; font-weight: 600; }
        .track-step.done .track-label, .track-step.active .track-label { color: #1f2937; }
    </style>
</head>
<body>
    <div class="container" style="margin-top:30px;">
        <h1 class="section-title">📦 My Orders</h1>
        <div id="message" class="message"></div>
        <div id="ordersContent"><p>Loading orders...</p></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (!requireLogin()) throw new Error('Not logged in');
        const ordersContent = document.getElementById('ordersContent');

        const STEPS = ['PENDING', 'PAID', 'SHIPPED', 'DELIVERED'];
        const STEP_LABELS = { PENDING: 'Placed', PAID: 'Paid', SHIPPED: 'Shipped', DELIVERED: 'Delivered', CANCELLED: 'Cancelled' };
        const STEP_ICONS = { PENDING: '📝', PAID: '💳', SHIPPED: '🚚', DELIVERED: '✅', CANCELLED: '❌' };

        async function loadOrders() {
            try {
                const orders = await getMyOrders();
                if (!orders || orders.length === 0) {
                    ordersContent.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📦</div>
                            <h3>You have no orders yet</h3>
                            <p>Place your first order today!</p>
                            <a href="index.html" class="btn">Start Shopping</a>
                        </div>`;
                    return;
                }
                ordersContent.innerHTML = orders.map(order => renderOrder(order)).join('');
            } catch (err) {
                ordersContent.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Error: ${err.message}</h3></div>`;
            }
        }

        function renderTimeline(status) {
            if (status === 'CANCELLED') {
                return `<div class="track-timeline"><div class="track-step cancelled"><div class="track-dot">✕</div><div class="track-label">Order Cancelled</div></div></div>`;
            }
            const currentIdx = STEPS.indexOf(status);
            return `
                <div class="track-timeline">
                    ${STEPS.map((s, i) => {
                        const cls = i < currentIdx ? 'done' : i === currentIdx ? 'active' : '';
                        return `
                            <div class="track-step ${cls}">
                                <div class="track-dot">${i <= currentIdx ? STEP_ICONS[s] : i + 1}</div>
                                <div class="track-label">${STEP_LABELS[s]}</div>
                            </div>`;
                    }).join('')}
                </div>`;
        }

        function renderOrder(order) {
            return `
                <div class="table-container" style="margin-bottom:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; flex-wrap:wrap; gap:10px;">
                        <div>
                            <h3 style="color:#1f2937;font-size:18px;">Order #${order.id}</h3>
                            <p style="color:#6b7280;font-size:13px;margin-top:4px;">Placed on: ${new Date(order.createdAt).toLocaleString()}</p>
                            ${order.shippingAddress ? `<p style="color:#6b7280;font-size:13px;margin-top:4px;">📍 ${order.shippingAddress}</p>` : ''}
                            ${order.paymentMethod ? `<p style="color:#6b7280;font-size:13px;margin-top:4px;">💳 ${order.paymentMethod}</p>` : ''}
                        </div>
                        <span class="status-badge status-${order.status}">${order.status}</span>
                    </div>
                    ${renderTimeline(order.status)}
                    <table>
                        <thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr></thead>
                        <tbody>
                            ${order.items.map(item => {
                                const img = item.product.imageUrl || 'https://via.placeholder.com/60?text=?';
                                return `
                                    <tr>
                                        <td><div class="table-product"><img src="${img}" alt="${item.product.name}" onerror="this.onerror=null;this.src='https://placehold.co/60x60/4f46e5/ffffff?text=?'"><span>${item.product.name}</span></div></td>
                                        <td>${formatPrice(item.price)}</td>
                                        <td>${item.quantity}</td>
                                        <td>${formatPrice(item.price * item.quantity)}</td>
                                    </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                    <div class="cart-total">Total: ${formatPrice(order.totalAmount)}</div>
                </div>
            `;
        }

        loadOrders();
    </script>
</body>
</html>
