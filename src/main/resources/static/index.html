<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="hero">
        <h1>Welcome to ShopEasy 🛍️</h1>
        <p>10 categories • 120+ products • Unbeatable prices</p>
        <a href="#products" class="btn btn-large">Shop Now</a>
    </section>

    <div id="searchBanner" style="display:none; max-width:1280px; margin:20px auto 0; padding:0 30px;">
        <div style="background:#eef2ff; padding:12px 20px; border-radius:8px; color:#4338ca; font-weight:600; display:flex; justify-content:space-between; align-items:center;">
            <span id="searchBannerText"></span>
            <button onclick="clearSearch()" style="background:none;border:none;color:#4338ca;cursor:pointer;font-weight:700;font-size:14px;">✕ Clear</button>
        </div>
    </div>

    <div class="categories" id="categories">
        <div class="chip active" onclick="filterByCategory(null, this)">✨ All</div>
        <div class="chip" onclick="filterByCategory(1, this)">📱 Electronics</div>
        <div class="chip" onclick="filterByCategory(2, this)">💄 Beauty</div>
        <div class="chip" onclick="filterByCategory(3, this)">👕 Clothing</div>
        <div class="chip" onclick="filterByCategory(4, this)">🏠 Home</div>
        <div class="chip" onclick="filterByCategory(5, this)">💪 Sports</div>
        <div class="chip" onclick="filterByCategory(6, this)">📚 Books</div>
        <div class="chip" onclick="filterByCategory(7, this)">🎮 Toys</div>
        <div class="chip" onclick="filterByCategory(8, this)">🛒 Grocery</div>
        <div class="chip" onclick="filterByCategory(9, this)">🚗 Auto</div>
        <div class="chip" onclick="filterByCategory(10, this)">👟 Footwear</div>
    </div>

    <div class="container" id="products">
        <h2 class="section-title" id="sectionTitle">Featured Products</h2>
        <div id="message" class="message"></div>
        <div id="productsGrid" class="products-grid"><p>Loading products...</p></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const grid = document.getElementById('productsGrid');
        const msg = document.getElementById('message');
        const searchBanner = document.getElementById('searchBanner');
        const searchBannerText = document.getElementById('searchBannerText');
        const sectionTitle = document.getElementById('sectionTitle');
        let allProducts = [];
        let currentSearch = '';

        async function loadProducts() {
            try {
                allProducts = await getProducts();
                applyFilters();
            } catch (err) {
                grid.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Failed to load products</h3><p>${err.message}</p></div>`;
            }
        }

        function applyFilters() {
            let filtered = [...allProducts];
            if (currentSearch) {
                const q = currentSearch.toLowerCase();
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(q) ||
                    (p.description && p.description.toLowerCase().includes(q)) ||
                    (p.category && p.category.name.toLowerCase().includes(q))
                );
                searchBanner.style.display = 'block';
                searchBannerText.textContent = `🔍 ${filtered.length} result${filtered.length !== 1 ? 's' : ''} for "${currentSearch}"`;
                sectionTitle.textContent = 'Search Results';
            } else {
                searchBanner.style.display = 'none';
            }
            renderProducts(filtered);
        }

        function renderProducts(products) {
            if (!products || products.length === 0) {
                grid.innerHTML = `<div class="empty-state"><div class="icon">📦</div><h3>No products found</h3><p>Try a different search or category.</p></div>`;
                return;
            }
            grid.innerHTML = products.map(p => {
                const img = p.imageUrl || 'https://via.placeholder.com/400x300?text=No+Image';
                const stockClass = p.stock === 0 ? 'out' : p.stock < 10 ? 'low' : '';
                const stockText = p.stock === 0 ? 'Out of Stock' : `In Stock: ${p.stock}`;
                const disabled = p.stock === 0 ? 'disabled' : '';
                const safeName = p.name.replace(/'/g, "\\'");
                return `
                    <div class="product-card">
                        <div class="product-image-wrap" onclick="window.location.href='product.html?id=${p.id}'">
                            <img src="${img}" alt="${p.name}" class="product-image" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/400x300/4f46e5/ffffff?text='+encodeURIComponent('${safeName}')">
                            <span class="stock-badge ${stockClass}">${stockText}</span>
                        </div>
                        <div class="product-body">
                            <div class="product-category">${p.category ? p.category.name : 'General'}</div>
                            <h3 onclick="window.location.href='product.html?id=${p.id}'">${p.name}</h3>
                            <p class="description">${p.description || ''}</p>
                            <div class="product-footer">
                                <div class="product-price">${formatPrice(p.price)}</div>
                            </div>
                            <button class="btn btn-success btn-block" ${disabled} onclick="handleAddToCart(${p.id}, '${safeName}')">
                                ${p.stock === 0 ? 'Out of Stock' : '🛒 Add to Cart'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterByCategory(categoryId, el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentSearch = '';
            searchBanner.style.display = 'none';
            sectionTitle.textContent = categoryId
                ? el.textContent.replace(/[^\w\s&]/g, '').trim() + ' Products'
                : 'Featured Products';
            const filtered = categoryId
                ? allProducts.filter(p => p.category && p.category.id === categoryId)
                : allProducts;
            renderProducts(filtered);
        }

        function clearSearch() {
            currentSearch = '';
            document.getElementById('globalSearch').value = '';
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.chip')[0].classList.add('active');
            sectionTitle.textContent = 'Featured Products';
            applyFilters();
        }

        async function handleAddToCart(productId, productName) {
            if (!isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            try {
                await addToCart(productId, 1);
                msg.className = 'message success';
                msg.textContent = `✓ "${productName}" added to cart!`;
                updateCartBadge();
                setTimeout(() => { msg.className = 'message'; }, 2500);
            } catch (err) {
                msg.className = 'message error';
                msg.textContent = err.message || 'Could not add to cart.';
            }
        }

        const params = new URLSearchParams(window.location.search);
        const searchParam = params.get('search');
        if (searchParam) currentSearch = searchParam;

        loadProducts().then(() => { if (currentSearch) applyFilters(); });
    </script>
</body>
</html>
